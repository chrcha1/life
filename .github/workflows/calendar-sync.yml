name: calendar-sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendar-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet icalendar recurring-ical-events requests
      - name: Fetch calendars
        env:
          ICS_URLS: ${{ secrets.ICS_URLS }}
        run: python scripts/sync_calendar.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet events.json; then
            git config user.name "weave-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "calendar sync"
            git pull --rebase origin main
            git push origin main
          fi
